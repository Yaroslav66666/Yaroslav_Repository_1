<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>
  <style>
     #canva-box {
      border: 2px solid black;
     }

     #clearAll {
			padding: 10px;
			font-size: 22px;
			display: block;
		}
  </style>
</head>
<body>
  <canvas id="canva-box" width="500" height="500">
     Виникла проблема з канвою
  </canvas>

  <label>
     Вибери колір
    <input type="color" id="colorPicker" value="#00ff00">
  </label>
  
  <label>
      Вибери прозорість
    <input type="range" id="alphaRange" min="0" max="1" step="0.05" value="0.5">
  </label>
  
  <button id="clearAll">Очистити все</button>




  <script src="./homework21.js"></script>
</body>
</html>
